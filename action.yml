name: 'Archynt Architecture Scan'
description: 'Free architecture check on every PR — cycles, coupling, single points of failure, dead code. Public repos, no signup.'
author: 'Archynt'

branding:
  icon: 'git-pull-request'
  color: 'purple'

inputs:
  language:
    description: 'Primary language of the repository: java | go | node | python'
    required: true
  api-base-url:
    description: 'Archynt API base URL (override only for self-hosted/staging use)'
    required: false
    default: 'https://api.archynt.com'

runs:
  using: 'composite'
  steps:
    - name: Run Archynt scan
      uses: actions/github-script@v7
      env:
        ARCHYNT_API_BASE_URL: ${{ inputs.api-base-url }}
        ARCHYNT_LANGUAGE: ${{ inputs.language }}
        ARCHYNT_SCAN_JS: ${{ github.action_path }}/scan.js
      with:
        script: |
          const run = require(process.env.ARCHYNT_SCAN_JS);
          await run({ github, context, core });
