name: 'Archynt Architecture Scan'
description: 'Free architecture check on every PR — cycles, coupling, single points of failure, dead code. Public repos, no signup.'
author: 'Archynt'

branding:
  icon: 'git-pull-request'
  color: 'purple'

inputs:
  language:
    description: 'Primary language of the repository: java | go | node | python'
    required: true
  api-base-url:
    description: 'Archynt API base URL (override only for self-hosted/staging use)'
    required: false
    default: 'https://api.archynt.com'

runs:
  using: 'composite'
  steps:
    - name: Run Archynt scan
      shell: bash
      run: |
        curl -sS -f -X POST "${{ inputs.api-base-url }}/api/v1/public/pr-scan" \
          -H "Content-Type: application/json" \
          -d "{\"owner\":\"${{ github.repository_owner }}\",\"repo\":\"${{ github.event.repository.name }}\",\"baseRef\":\"${{ github.base_ref }}\",\"headRef\":\"${{ github.head_ref }}\",\"language\":\"${{ inputs.language }}\"}" \
          > archynt-result.json

    - name: Post PR comment
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const result = JSON.parse(fs.readFileSync('archynt-result.json', 'utf8'));
          if (context.payload.pull_request) {
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.payload.pull_request.number,
              body: result.summaryMarkdown,
            });
          }
